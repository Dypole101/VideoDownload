
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NightLoad - Video Downloader</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #080b12;
      color: #f4f6ff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: #111622;
      border: 1px solid #252d40;
      border-radius: 22px;
      padding: 30px;
      box-shadow: 0 20px 70px #0008;
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .logo span {
      color: #8b5cf6;
    }

    .subtitle {
      color: #929bb0;
      text-align: center;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-size: 13px;
      color: #b7bfd0;
      margin-bottom: 9px;
    }

    input, select {
      width: 100%;
      padding: 15px;
      border: 1px solid #30394d;
      border-radius: 11px;
      background: #090d16;
      color: white;
      outline: none;
      font-size: 15px;
      margin-bottom: 18px;
    }

    input:focus, select:focus {
      border-color: #8b5cf6;
    }

    button, .open-link {
      display: block;
      width: 100%;
      border: none;
      border-radius: 11px;
      padding: 15px;
      background: #8b5cf6;
      color: white;
      font-size: 15px;
      font-weight: bold;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }

    button:hover, .open-link:hover {
      background: #7543e8;
    }

    .secondary {
      background: #20283a;
      margin-top: 10px;
    }

    .secondary:hover {
      background: #303b52;
    }

    #message {
      display: none;
      padding: 13px;
      margin-top: 16px;
      border-radius: 10px;
      background: #1b2436;
      color: #cbd5e1;
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .note {
      margin-top: 22px;
      text-align: center;
      color: #7f899e;
      font-size: 12px;
      line-height: 1.7;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="logo">Night<span>Load</span></div>

    <p class="subtitle">
      A simple video-link helper for Instagram and YouTube.
    </p>

    <label for="videoUrl">Video URL or direct media URL</label>
    <input
      id="videoUrl"
      type="url"
      placeholder="Paste your video link here..."
      autocomplete="url"
    >

    <label for="format">Preferred format</label>
    <select id="format">
      <option value="mp4">MP4 — Video</option>
      <option value="mp3">MP3 — Audio</option>
    </select>

    <button onclick="processLink()">Continue</button>

    <div id="message" role="status"></div>

    <a
      id="openLink"
      class="open-link secondary"
      href="#"
      target="_blank"
      rel="noopener noreferrer"
      style="display:none"
    >Open video</a>

    <p class="note">
      No account or backend required.<br>
      Use media you own or have permission to download.
      Instagram and YouTube links may not support direct downloading here.
    </p>
  </main>

  <script>
    function processLink() {
      const input = document.getElementById("videoUrl");
      const format = document.getElementById("format").value;
      const message = document.getElementById("message");
      const openLink = document.getElementById("openLink");

      const rawUrl = input.value.trim();

      message.style.display = "block";
      openLink.style.display = "none";

      if (!rawUrl) {
        message.textContent = "Please paste a video URL first.";
        return;
      }

      let url;

      try {
        url = new URL(rawUrl);
      } catch {
        message.textContent = "Please enter a valid URL, including https://";
        return;
      }

      if (!["http:", "https:"].includes(url.protocol)) {
        message.textContent = "Please enter a valid HTTP or HTTPS link.";
        return;
      }

      const host = url.hostname.toLowerCase().replace(/^www\./, "");
      const isInstagram =
        host === "instagram.com" || host.endsWith(".instagram.com");
      const isYouTube =
        host === "youtube.com" ||
        host.endsWith(".youtube.com") ||
        host === "youtu.be";

      const path = url.pathname.toLowerCase();
      const isDirectMedia =
        /\.(mp4|webm|mov|mp3|m4a|wav|ogg)(?:$)/i.test(path);

      if (isDirectMedia) {
        if (format === "mp3" && !/\.(mp3|m4a|wav|ogg)$/i.test(path)) {
          message.textContent =
            "This direct link appears to be a video. This page cannot convert it to MP3.";
          return;
        }

        if (format === "mp4" && !/\.(mp4|webm|mov)$/i.test(path)) {
          message.textContent =
            "This direct link appears to be audio. Choose MP3 for this file.";
          return;
        }

        const link = document.createElement("a");
        link.href = url.href;
        link.download = "";
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        document.body.appendChild(link);
        link.click();
        link.remove();

        message.textContent =
          "Download requested. The host website may open the file instead, depending on its settings.";
        return;
      }

      if (isInstagram || isYouTube) {
        openLink.href = url.href;
        openLink.style.display = "block";
        openLink.textContent = isInstagram
          ? "Open Instagram video"
          : "Open YouTube video";

        message.textContent =
          "This is a " + (isInstagram ? "Instagram" : "YouTube") +
          " link. A standalone GitHub Pages website cannot extract or convert this video. Open the original link below.";
        return;
      }

      openLink.href = url.href;
      openLink.textContent = "Open supplied link";
      openLink.style.display = "block";

      message.textContent =
        "This link is not a recognized Instagram or YouTube URL. If it is a direct media link, try opening it below.";
    }
  </script>
</body>
</html>
